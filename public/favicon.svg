<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#2a1654" />
      <stop offset="100%" stop-color="#0f0720" />
    </radialGradient>
    
    <!-- Glassmorphic Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#825af0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4c27a6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Star Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Icon Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)" />

  <!-- Tooth Shape (Stylized / Glassmorphic) -->
  <path d="M190 140 C190 120, 230 110, 256 140 C282 110, 322 120, 322 140 C322 200, 340 280, 310 350 C290 400, 270 410, 256 370 C242 410, 222 400, 202 350 C172 280, 190 200, 190 140 Z" 
        fill="url(#glass)" 
        stroke="url(#glass-border)" 
        stroke-width="8" />

  <!-- Tooth Highlights (for Glass Effect) -->
  <path d="M205 150 C205 140, 235 130, 256 150" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" />

  <!-- Glowing Star in the Center -->
  <path d="M256 190 Q256 240 306 240 Q256 240 256 290 Q256 240 206 240 Q256 240 256 190 Z" 
        fill="#c4b0ff" 
        filter="url(#glow)" />
  <path d="M256 200 Q256 240 296 240 Q256 240 256 280 Q256 240 216 240 Q256 240 256 200 Z" 
        fill="#ffffff" />
</svg>